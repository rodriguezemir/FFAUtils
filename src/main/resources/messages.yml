tiers-status-no-spawns: "<gray>No restricted spawns configured."
tiers-reloaded: "<green>Tier configuration reloaded."
tiers-cache-cleared: "<green>Tier cache cleared ({entries} entries)."
tiers-lookup: "<gray>{player} on <white>{provider}</white>: <white>{current}</white> in <white>{gamemode}</white>"
tiers-lookup-none: "<red>{player} has no tiers on {provider}."
tiers-lookup-failed: "<red>Could not query tier for {player} on {provider}."
tiers-player-not-found: "<red>Player {player} is not connected."
tiers-unknown-provider: "<red>Unknown provider: {provider}."

# Fto10 duels
fto10-player-not-found: "<red>Player <yellow>{player}</yellow> is not connected."

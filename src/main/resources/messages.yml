# Respawn messages
respawn-applied: "<green>You have been respawned with your kit!"

health-regenerated: "<green>{health}hp health regenerated"

# Misc
reload-success: "<green>FFAUtils has been reloaded."

# Killstreak broadcasts
killstreak-lost: "{player} lost a streak of {kills} kills."

# Kit lifecycle messages
kit-applied: "<green>Kit '{name}' has been applied."
kit-already-exists: "<red>Kit '{name}' already exists."
kit-created: "<green>Kit '{name}' has been created."
kit-edited: "<green>Kit '{name}' has been edited."
kit-deleted: "<green>Kit '{name}' has been deleted."
kits-list: "<green>Kits: {kits}"

# Combat log messages
combat-enter: "<yellow>You are now in combat. Do not logout!"
combat-exit: "<green>You are no longer in combat."
combat-actionbar: "<yellow>You are now in combat. Do not logout!"

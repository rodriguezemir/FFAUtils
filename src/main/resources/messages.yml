tier-lookup-failed: "<red>Could not verify your tier on <white>{provider}</white>. Try again."
tiers-enabled: "<green>Tier spawn blocking has been enabled."
tiers-disabled: "<yellow>Tier spawn blocking has been disabled."
tiers-status: "<gray>Tier blocking: {status} <dark_gray>|</dark_gray> <gray>provider: <white>{provider}</white> <dark_gray>|</dark_gray> <gray>gamemode: <white>{gamemode}</white>"
tiers-status-provider: "<dark_gray> - <white>{provider}</white> <gray>{url} <dark_gray>(cache: {cache})</dark_gray>"

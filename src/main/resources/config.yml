# If true, players cannot use lobby hotbar items (spawn selector, kit menu, etc.)
# while inside a spawn. Useful when the arena inventory should be the only focus.
disable-lobby-items: false

# How long (in seconds) a player stays tagged as "in combat" after their last
# attack or hit. While in combat they cannot logout safely, use blocked commands,
# or switch kits. Also shown as a countdown in the action bar.
time-combat-log: 15

# Name of the SQLite database file (inside the plugin data folder) where player
# statistics such as kills, deaths and killstreaks are stored.
stats-database-name: stats.db

# Spawn permission blocking. When enabled, each spawn requires the
# ffautils.spawn.<name> permission by default. You can define individual
# permissions for specific arenas in the list below. If the list is not empty,
# only the listed arenas are restricted.
spawn-permissions:
  enabled: false
  arenas: {}
  # Example:
  # arenas:
  #   arena1: "ffautils.spawn.arena1"
  #   arena2: "arena.access.two"

# Spawn blocking by tiers
tiers:
  # Enables or disables the blocking. Can also be toggled at runtime with /tiers toggle
  enabled: false

  # Where tiers are read from: mctiers, pvptiers, elitestorm, or "any" to
  # let the player in if ANY provider allows them
  provider: "mctiers"

  providers:
    # https://mctiers.com/docs/v2 - uses the UUID WITH dashes
    mctiers:
      api-url: "https://mctiers.com/api/v2"
    # https://pvptiers.com/api/profile/<uuid> - uses the UUID WITHOUT dashes
    pvptiers:
      api-url: "https://pvptiers.com/api"
    # https://api.elitestorm.es/v2/users?nickname=<nick>
    elitestorm:
      api-url: "https://api.elitestorm.es/v2"
      # nickname (default) or uuid. With nickname it works on offline-mode
      # servers, where the UUID given by Bukkit is local and does not match
      # the Mojang UUID the other sites are keyed by. NOTE: the ?uuid= query
      # needs the UUID WITHOUT dashes; with dashes the API returns 422
      lookup-by: "nickname"
      # EliteStorm gamemode ids are scoped to a guild. The plugin reads the
      # vocabulary from /v2/modes?guildId=<this> on startup; if that fails,
      # it falls back to the default values for this guild
      guild-id: "990623865174642718"

  # Gamemode (slug) the player is evaluated on. Use "best" to take their
  # best tier from any gamemode.
  #   mctiers:    vanilla, sword, axe, pot, nethop, uhc, smp, mace
  #   pvptiers:   sword, axe, pot, neth_pot, uhc, smp, mace, crystal
  #   elitestorm: vanilla, sword, axe, pot, nethop, uhc, smp, mace
  # Equivalent slugs are translated automatically between providers (nethop <-> neth_pot).
  # A gamemode that does not exist on a provider simply gives no ranking there
  # (vanilla only exists on mctiers, crystal only on pvptiers)
  gamemode: "vanilla"

  # Default requirement. tier goes from 1 to 5 (lower is better) and pos is 0 = high, 1 = low.
  # tier 3 + pos 0 means "HT3 or better"
  tier: 3
  pos: 0

  # Blocked spawns. Each one can override tier, pos, gamemode and provider
  restricted-spawns:
    tryhard:
      tier: 3
      pos: 0
      provider: "mctiers"

  # Retired players are judged by their peak tier, as recommended by the API
  use-peak-when-retired: true

  # If the API does not respond: true lets the player in, false blocks them
  allow-on-error: true

  # Tiers are cached per UUID (one per provider) so we do not query the API
  # on every attempt. Shared by all providers
  cache-minutes: 30
  error-cache-minutes: 2
  timeout-seconds: 5

  # Fetch the tier when the player joins so the later check is instant
  prefetch-on-join: true

  # Permission that bypasses the blocking. Leave empty so nobody bypasses it
  bypass-permission: "ffautils.tiers.bypass"

# Whether to send the combat-enter message when a player enters combat
combat-enter-message: true
